[tools]
flutter = "3.44.9"
java = "temurin-17"
zizmor = "latest"

[tasks]
format = "dart format -o none --set-exit-if-changed ./lib"
"format:write" = "dart format"
analyze = "flutter analyze --no-fatal-infos"
test = "flutter test"
"build:apk" = "flutter build apk --release"
"build:apk-split" = "flutter build apk --release --split-per-abi"
"lint:workflows" = "zizmor ./github/workflows"

[tasks.ci]
depends = ["analyze", "test", "format"]

[tasks.release]
depends = ["build:apk"]
depends_post = ["build:apk-split"]

[settings]
lockfile = true
