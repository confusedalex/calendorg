name: build and release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.38.0
          cache-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal release
        run: flutter build apk --release

      - name: Build release
        run: flutter build apk --release --split-per-abi

      - name: Rename release artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-x86_64.apk
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-x86_64.apk
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-universal.apk
          tag_name: ${{ github.ref_name }}
          prerelease: false
