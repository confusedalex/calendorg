name: CI and release

permissions: {}

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
          version: 2026.09.2
      - run: mise run ci

  release:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
          version: 2026.09.2

      - run: mise run release

      - name: Rename release artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/app/outputs/flutter-apk/calendorg-${GITHUB_REF_NAME}-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/calendorg-${GITHUB_REF_NAME}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/calendorg-${GITHUB_REF_NAME}-x86_64.apk
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/calendorg-${GITHUB_REF_NAME}-universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-x86_64.apk
            build/app/outputs/flutter-apk/calendorg-${{ github.ref_name }}-universal.apk
          tag_name: ${{ github.ref_name }}
          prerelease: false
